# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/deployLists.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create .env file
        run: |
          echo "VITE_EMAIL_WHITELIST=${{ secrets.APPROVED_EMAILS }}" > .env
          echo "VITE_CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "VITE_SHOW_QUIZ_DATA=${{ secrets.FF_SHOW_QUIZ_DATA }}" >> .env
          echo "VITE_DATA_MODE=${{ secrets.DATA_MODE }}" >> .env
          echo "VITE_AUTH_MODE=${{ secrets.AUTH_MODE }}" >> .env
          echo "VITE_API_BASE=${{ secrets.API_BASE }}" >> .env
          echo "VITE_DEBUG_LOG=${{ secrets.FRONTEND_DEBUG_LOG }}" >> .env
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
