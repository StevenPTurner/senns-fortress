services:

  frontend:
    container_name: senns-fortress-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./frontend/.env
          target: /app/.env
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "3000:5173"
    depends_on:
      - backend

  backend:
    container_name: senns-fortress-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DOCKER_COMPOSE_ENABLED: false
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle_cache:/home/gradle/.gradle
    depends_on:
      - database

  database:
    image: postgres:16
    container_name: senns-fortress-database
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  gradle_cache:
